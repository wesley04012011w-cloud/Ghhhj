name: Build Android APK - React Native

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Download React Native project ZIP
        env:
          PROJECT_ZIP_URL: ${{ secrets.PROJECT_ZIP_URL }}
        run: |
          set -e
          if [ -z "$PROJECT_ZIP_URL" ]; then
            echo "PROJECT_ZIP_URL secret is required."
            exit 1
          fi
          curl -L --fail --retry 3 "$PROJECT_ZIP_URL" -o project.zip

      - name: Extract project
        run: |
          set -e
          rm -rf project
          mkdir project
          unzip -q project.zip -d project

          if [ ! -f project/package.json ]; then
            ROOT="$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -n "$ROOT" ] && [ -f "$ROOT/package.json" ]; then
              shopt -s dotglob
              mv "$ROOT"/* project/
              rmdir "$ROOT"
            fi
          fi

          test -f project/package.json
          test -f project/android/gradlew
          chmod +x project/android/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node 22.13.1
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install npm dependencies
        working-directory: project
        run: npm ci

      - name: Verify React Native environment
        working-directory: project
        run: npx react-native --version

      - name: Build release APK
        working-directory: project/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-react-native-release
          path: project/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

