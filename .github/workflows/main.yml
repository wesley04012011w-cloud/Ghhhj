name: Build Android project from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t zips < <(find . -maxdepth 1 -type f -name '*.zip' -print)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one project ZIP in the repository root."
            printf '%s\n' "${zips[@]}"
            exit 1
          fi
          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q "${{ steps.zip.outputs.zip }}" -d project

      - name: Detect project root
        id: root
        shell: bash
        run: |
          set -euo pipefail
          if [ -f project/settings.gradle.kts ]; then
            ROOT=project
          else
            ROOT="$(find project -mindepth 1 -maxdepth 2 -type f -name settings.gradle.kts -printf '%h\n' | head -n1)"
          fi
          test -n "$ROOT"
          test -f "$ROOT/settings.gradle.kts"
          echo "path=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project root: $ROOT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.28.1"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch llama.cpp
        working-directory: ${{ steps.root.outputs.path }}
        run: |
          chmod +x scripts/fetch-llama.sh
          ./scripts/fetch-llama.sh

      - name: Build release APK
        working-directory: ${{ steps.root.outputs.path }}
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-release
          path: ${{ steps.root.outputs.path }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

