
name: Build Android from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP encontrado."
            exit 1
          fi

          echo "ZIP: $ZIP"
          echo "file=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q "${{ steps.zip.outputs.file }}" -d project

      - name: Find project root
        id: project
        shell: bash
        run: |
          set -e

          if [ -f project/settings.gradle.kts ]; then
            ROOT="project"
          else
            ROOT="$(find project \
              -type f \
              -name settings.gradle.kts \
              -printf '%h\n' | head -n 1)"
          fi

          if [ -z "$ROOT" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          echo "Projeto: $ROOT"
          echo "path=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Show Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "SDK:"
          ls -la "$ANDROID_HOME" || true

          echo ""
          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk" || true

          echo ""
          echo "CMake:"
          ls -la "$ANDROID_HOME/cmake" || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download llama.cpp
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          chmod +x scripts/fetch-llama.sh
          ./scripts/fetch-llama.sh

      - name: Build APK
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Find APK
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-release
          path: ${{ steps.project.outputs.path }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
