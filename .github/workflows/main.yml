
name: Build Android from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-from-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "Nenhum ZIP encontrado na raiz do repositório."
            exit 1
          fi

          echo "ZIP encontrado: $ZIP"
          echo "file=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q "${{ steps.zip.outputs.file }}" -d project

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          ROOT=""

          if [ -f "project/settings.gradle.kts" ]; then
            ROOT="project"
          else
            ROOT="$(find project \
              -type f \
              -name 'settings.gradle.kts' \
              -printf '%h\n' | head -n 1)"
          fi

          if [ -z "$ROOT" ]; then
            echo "settings.gradle.kts não encontrado."
            find project -maxdepth 3 -type f
            exit 1
          fi

          echo "Projeto encontrado em: $ROOT"
          echo "path=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -name sdkmanager \
              -type f | head -n 1)"
          fi

          echo "Usando sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.28.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download llama.cpp
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          chmod +x scripts/fetch-llama.sh
          ./scripts/fetch-llama.sh

      - name: Build APK
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-release
          path: ${{ steps.project.outputs.path }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
