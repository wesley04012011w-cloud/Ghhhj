name: Build Android APK - React Native

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "No project ZIP found in the repository."
            exit 1
          fi
          echo "Using: $ZIP"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract React Native project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q "${{ steps.zip.outputs.path }}" -d project

          if [ ! -f project/package.json ]; then
            ROOT="$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -n "$ROOT" ] && [ -f "$ROOT/package.json" ]; then
              shopt -s dotglob nullglob
              mv "$ROOT"/* project/
              rmdir "$ROOT"
            fi
          fi

          test -f project/package.json
          test -f project/android/settings.gradle
          test -f project/android/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22.13.1
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Set up Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager             "platform-tools"             "platforms;android-37"             "build-tools;37.0.0"             "cmake;3.31.6"             "ndk;27.1.12297006"

      - name: Install npm dependencies
        working-directory: project
        run: npm install --no-audit --no-fund

      - name: Fetch llama.cpp
        working-directory: project
        run: |
          chmod +x scripts/fetch-llama.sh
          ./scripts/fetch-llama.sh

      - name: Verify project
        working-directory: project
        run: |
          test -d android/app/src/main/cpp/llama.cpp
          test -f android/settings.gradle
          test -f package.json
          npx react-native --version

      - name: Build release APK
        working-directory: project/android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-react-native-release
          path: project/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
