name: Build React Native Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          test -n "$ZIP"
          echo "Using: $ZIP"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract React Native project
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q "${{ steps.find_zip.outputs.path }}" -d project

          if [ ! -f project/package.json ]; then
            ROOT="$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -n "$ROOT" ] && [ -f "$ROOT/package.json" ]; then
              shopt -s dotglob nullglob
              mv "$ROOT"/* project/
              rmdir "$ROOT"
            fi
          fi

          test -f project/package.json
          test -f project/android/settings.gradle
          test -f project/android/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -path '*/cmdline-tools/*/bin/sdkmanager' | head -n 1)"
          test -n "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6" "ndk;27.1.12297006"

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          test -d "$SDK_ROOT/cmake/3.31.6"
          test -d "$SDK_ROOT/ndk/27.1.12297006"
          java -version
          node --version
          npm --version
          gradle --version

      - name: Install JavaScript dependencies
        working-directory: project
        run: npm install --no-audit --no-fund

      - name: Verify React dependency
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.dependencies.react!=='19.2.3') { throw new Error('Expected React 19.2.3, got '+p.dependencies.react) }; if(p.dependencies['react-native']!=='0.87.0') { throw new Error('Expected React Native 0.87.0, got '+p.dependencies['react-native']) }"

      - name: Fetch llama.cpp
        working-directory: project
        run: bash scripts/fetch-llama.sh

      - name: Verify llama.cpp
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/cpp/CMakeLists.txt
          test -d android/app/src/main/cpp/llama.cpp

      - name: Build release APK
        working-directory: project/android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-react-native-apk
          path: project/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

