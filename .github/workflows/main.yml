name: Build Android APK - React Native

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        id: zip
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "No project ZIP found in the repository."
            exit 1
          fi
          echo "Using: $ZIP"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract React Native project
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir project
          unzip -q "${{ steps.zip.outputs.path }}" -d project

          # Support ZIPs with a single top-level project directory.
          if [ ! -f project/package.json ]; then
            ROOT="$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
            if [ -n "$ROOT" ] && [ -f "$ROOT/package.json" ]; then
              shopt -s dotglob
              mv "$ROOT"/* project/
              rmdir "$ROOT"
            fi
          fi

          test -f project/package.json
          test -f project/android/gradlew
          chmod +x project/android/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: project/android/**/*.gradle*

      - name: Set up Node 22.13.1
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
          cache-dependency-path: project/package-lock.json

      - name: Install npm dependencies
        working-directory: project
        run: npm ci

      - name: Check React Native version
        working-directory: project
        run: npx react-native --version

      - name: Build release APK
        working-directory: project/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-chat-react-native-release
          path: project/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
